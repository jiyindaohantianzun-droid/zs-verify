<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>授权业务代表核验 · 中盛（镇江）新能源</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpolygon points='24,3 43,14 43,34 24,45 5,34 5,14' fill='%231B3A8B'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
:root{--navy:#1B3A8B;--navy-d:#132B68;--ok:#1a9e6e;--ok-bg:#e7f7f0;--bad:#c14545;--bad-bg:#fbeaea;--warn:#b96a12;--warn-bg:#fdf3e3;--line:#e6e9f0;--mut:#7a8396;--ink:#222a3a;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-text-size-adjust:100%;}
body{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;background:#eef1f6;color:var(--ink);min-height:100vh;}
.wrap{max-width:430px;margin:0 auto;min-height:100vh;background:#f4f6fa;box-shadow:0 0 24px rgba(20,40,90,.08);}
.top{background:linear-gradient(150deg,var(--navy),var(--navy-d));padding:16px 18px;display:flex;align-items:center;gap:11px;}
.top .lg{width:40px;height:40px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.top .lg img{width:31px;height:31px;object-fit:contain;}
.top .cn{color:#fff;font-size:14.5px;font-weight:700;line-height:1.35;}
.top .cn small{display:block;font-size:10.5px;font-weight:400;opacity:.82;margin-top:2px;}
.banner{margin:16px 16px 0;border-radius:12px;padding:18px 16px;text-align:center;}
.banner.ok{background:var(--ok-bg);border:1px solid #bfe6d5;}
.banner.bad{background:var(--bad-bg);border:1px solid #f0c5c5;}
.banner.warn{background:var(--warn-bg);border:1px solid #f2dcb8;}
.banner .ico{width:46px;height:46px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;}
.banner.ok .ico{background:var(--ok);}
.banner.bad .ico{background:var(--bad);}
.banner.warn .ico{background:var(--warn);}
.banner .st{font-size:19px;font-weight:900;}
.banner.ok .st{color:var(--ok);}
.banner.bad .st{color:var(--bad);}
.banner.warn .st{color:var(--warn);}
.banner .ds{font-size:11.5px;color:var(--mut);margin-top:6px;line-height:1.6;}
.card{background:#fff;margin:14px 16px 0;border-radius:12px;padding:15px 16px;border:1px solid var(--line);}
.card h3{font-size:13.5px;font-weight:700;color:var(--navy);margin-bottom:12px;display:flex;align-items:center;gap:7px;}
.card h3::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--navy);}
.kv{display:flex;font-size:13px;line-height:1.5;padding:6px 0;}
.kv .k{width:72px;color:var(--mut);flex:0 0 auto;font-size:12.5px;}
.kv .v{color:var(--ink);font-weight:500;flex:1;word-break:break-all;}
ul.scope{list-style:none;}
ul.scope li{font-size:12.8px;line-height:1.5;padding:5px 0 5px 22px;color:#333d52;position:relative;}
ul.scope li::before{content:"";position:absolute;left:0;top:9px;width:13px;height:13px;border-radius:50%;background:var(--ok-bg);border:1px solid #9fd8c0;}
ul.scope li::after{content:"";position:absolute;left:4px;top:12px;width:5px;height:3px;border-left:1.6px solid var(--ok);border-bottom:1.6px solid var(--ok);transform:rotate(-45deg);}
.doc-group{margin-bottom:14px;}
.doc-group:last-child{margin-bottom:2px;}
.doc-group .gt{font-size:12px;font-weight:700;color:#445; margin:0 0 8px 2px;}
.doc-row{display:flex;flex-wrap:wrap;gap:10px;}
.doc-item{width:calc(33.333% - 7px);border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fafbfe;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.doc-item .ph{width:100%;height:92px;background:#eef1f6;display:flex;align-items:center;justify-content:center;}
.doc-item .ph img{width:100%;height:100%;object-fit:cover;}
.doc-item .nm{font-size:9.5px;color:#556;line-height:1.25;padding:5px 4px 6px;text-align:center;min-height:34px;display:flex;align-items:center;justify-content:center;}
.notice{background:var(--warn-bg);border:1px solid #f2dcb8;}
.notice h3{color:var(--warn);}
.notice h3::before{background:var(--warn);}
.notice p{font-size:12.6px;line-height:1.65;color:#6f4d1e;padding:4px 0;}
.notice p b{color:var(--warn);}
.foot{padding:18px 20px 26px;text-align:center;}
.foot p{font-size:10.8px;color:var(--mut);line-height:1.7;}
.foot .seal{font-size:11px;color:var(--navy);font-weight:600;margin-bottom:6px;}
.lb{position:fixed;inset:0;z-index:99;background:rgba(8,10,16,.94);display:flex;flex-direction:column;}
.lb[hidden]{display:none;}
.lb-top{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;color:#cdd3df;font-size:12px;}
.lb-mid{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:2px 8px;position:relative;}
.lb-mid img{max-width:100%;max-height:100%;object-fit:contain;border-radius:2px;}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;border:none;font-size:20px;display:flex;align-items:center;justify-content:center;}
.lb-nav.prev{left:4px;} .lb-nav.next{right:4px;}
.lb-nav[disabled]{opacity:.25;}
.lb-bot{padding:10px 14px calc(14px + env(safe-area-inset-bottom));text-align:center;color:#aab2c2;}
.lb-bot .cap{font-size:12.5px;color:#e6e9f0;margin-bottom:8px;line-height:1.4;}
.lb-bot a{display:inline-block;font-size:11.5px;color:#9db4e8;padding:6px 14px;border-radius:16px;border:1px solid #3a4358;text-decoration:none;}
.lb-x{background:rgba(255,255,255,.12);color:#fff;border:none;width:32px;height:32px;border-radius:50%;font-size:16px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="lg"><img src="logo.png" alt="中盛集团LOGO"></div>
    <div class="cn">中盛（镇江）新能源有限公司<small>授权业务代表 · 信息核验</small></div>
  </div>
  <div id="app"></div>
</div>
<div id="lb" class="lb" hidden>
  <div class="lb-top"><span id="lb-cnt"></span><button class="lb-x" id="lb-x" aria-label="关闭">✕</button></div>
  <div class="lb-mid">
    <button class="lb-nav prev" id="lb-prev" aria-label="上一张">‹</button>
    <img id="lb-img" src="" alt="凭证大图">
    <button class="lb-nav next" id="lb-next" aria-label="下一张">›</button>
  </div>
  <div class="lb-bot"><div class="cap" id="lb-cap"></div><a id="lb-orig" href="#" target="_blank" rel="noopener">查看原图（可手势放大）</a></div>
</div>
<script>
var VALID_FROM = "2026-09-24";
var VALID_TO   = "2027-12-31";
var REPS = {
  "SD-2027-0001": {
    name:"张　明", role:"客户经理", region:"江苏省",
    issue:"2026.09.24", valid:"2026.09.24 — 2027.12.31", status:"active",
    scope:[
      "介绍我司售电业务与零售套餐、传递业务资料",
      "安排我司与贵司沟通洽谈",
      "引导贵司在江苏电力交易平台自助办理注册与零售绑定"
    ]
  }
};
var COMPANY = { code:"91321112MA260HAW86", reg:"江苏电力交易中心 苏电注册公告2025-129号" };
var DOCS = [
  { group:"营业执照", items:[ {src:"cert-license.jpg", t:"营业执照（中盛（镇江）新能源有限公司）"} ]},
  { group:"售电公司市场注册凭证", items:[
    {src:"cert-zizhi-1.jpg", t:"苏电注册公告2025-129号 · 公示结果通知（正文）"},
    {src:"cert-zizhi-2.jpg", t:"公示结果通知（落款 · 交易中心盖章）"},
    {src:"cert-zizhi-3.jpg", t:"公示结果目录（中盛注册生效，结果：通过）"}
  ]},
  { group:"银行履约保函", items:[
    {src:"cert-hanhan-1.jpg", t:"江苏银行《江苏电力市场履约保函》（正文，担保金额2000万元）"},
    {src:"cert-hanhan-2.jpg", t:"履约保函（续页 · 江苏银行盖章）"}
  ]}
];
function el(html){var d=document.createElement("div");d.innerHTML=html;return d.firstChild;}
function esc(s){return String(s).replace(/[<>&"]/g,function(c){return {"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c];});}
function svgs(){return {
  check:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  cross:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>',
  clock:'<svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>'
};}
function day(s){return new Date(s+"T00:00:00");}
function today0(){var d=new Date();d.setHours(0,0,0,0);return d;}
function demoState(){var m=location.search.match(/[?&]demo=([a-z]+)/);return m?m[1]:"";}
function stateOf(){
  var dm=demoState();
  if(dm==="expired")return "expired";
  if(dm==="valid")return "valid";
  var t=today0();
  if(t<day(VALID_FROM))return "notyet";
  if(t>day(VALID_TO))return "expired";
  return "valid";
}
function render(){
  var app=document.getElementById("app"); app.innerHTML="";
  var id=location.hash?location.hash.slice(1):"SD-2027-0001";
  var r=REPS[id]; var I=svgs();
  if(!r || r.status!=="active"){
    app.appendChild(el('<div class="banner bad"><div class="ico">'+I.cross+'</div><div class="st">未查询到有效授权</div><div class="ds">该证件编号不存在或授权已终止/失效<br>编号：'+esc(id)+'</div></div>'));
    app.appendChild(el('<div class="card"><h3>温馨提示</h3><div style="font-size:12.6px;line-height:1.7;color:#6f4d1e;">请谨慎与该人员开展业务。我司主体及售电资质可通过国家企业信用信息公示系统、江苏电力交易中心公示查询核实。</div></div>'));
    foot(app); return;
  }
  var st=stateOf();
  if(st==="expired"){
    app.appendChild(el('<div class="banner bad"><div class="ico">'+I.cross+'</div><div class="st">授权已过期</div><div class="ds">该授权有效期为 '+esc(r.valid)+'<br>现已超过有效期，授权自动失效<br>编号：'+esc(id)+'</div></div>'));
    app.appendChild(el('<div class="card"><h3>温馨提示</h3><div style="font-size:12.6px;line-height:1.7;color:#6f4d1e;">该证件已失效，不能再用于业务接洽。如需核实或续期，请通过国家企业信用信息公示系统、江苏电力交易中心等正规渠道与我司联系。</div></div>'));
    foot(app); return;
  }
  if(st=="notyet"){
    app.appendChild(el('<div class="banner warn"><div class="ico">'+I.clock+'</div><div class="st">授权尚未生效</div><div class="ds">本授权自 '+VALID_FROM.replace(/-/g,".")+' 起生效<br>编号：'+esc(id)+'</div></div>'));
  }else{
    app.appendChild(el('<div class="banner ok"><div class="ico">'+I.check+'</div><div class="st">授权有效</div><div class="ds">以下人员为我司授权业务代表，请核对证件与本人一致</div></div>'));
  }
  app.appendChild(el(
    '<div class="card"><h3>授权代表信息</h3>'+
    '<div class="kv"><span class="k">姓　名</span><span class="v">'+esc(r.name)+'</span></div>'+
    '<div class="kv"><span class="k">职　务</span><span class="v">'+esc(r.role)+'</span></div>'+
    '<div class="kv"><span class="k">编　号</span><span class="v">'+esc(id)+'</span></div>'+
    '<div class="kv"><span class="k">授权区域</span><span class="v">'+esc(r.region)+'</span></div>'+
    '<div class="kv"><span class="k">签发日期</span><span class="v">'+esc(r.issue)+'</span></div>'+
    '<div class="kv"><span class="k">有效期</span><span class="v">'+esc(r.valid)+'</span></div></div>'));
  app.appendChild(el('<div class="card"><h3>授权范围</h3><ul class="scope">'+r.scope.map(function(s){return '<li>'+esc(s)+'</li>';}).join('')+'</ul></div>'));
  var docsHtml='<div class="card"><h3>资质与凭证（点击查看大图）</h3>';
  var allCount=0;
  DOCS.forEach(function(g){
    docsHtml+='<div class="doc-group"><div class="gt">'+esc(g.group)+'</div><div class="doc-row">';
    g.items.forEach(function(it){
      docsHtml+='<button type="button" class="doc-item" data-i="'+(allCount++)+'"><span class="ph"><img src="'+it.src+'" alt="'+esc(it.t)+'" loading="lazy"></span><span class="nm">'+esc(it.t)+'</span></button>';
    });
    docsHtml+='</div></div>';
  });
  docsHtml+='</div>';
  app.appendChild(el(docsHtml));
  app.appendChild(el(
    '<div class="card notice"><h3>重要提示（请务必知悉）</h3>'+
    '<p>1. 购售电合同（零售套餐）以<b>江苏电力交易平台电子合同</b>或经我司盖章文本为准，经平台绑定确认后生效；</p>'+
    '<p>2. 我司<b>未授权任何个人收取电费、保证金、服务费</b>等费用，请勿向个人账户付款；</p>'+
    '<p>3. 任何<b>口头电价、电量承诺均不代表我司，均属无效</b>。</p></div>'));
  app.appendChild(el(
    '<div class="card"><h3>我司资质</h3>'+
    '<div class="kv"><span class="k">信用代码</span><span class="v">'+esc(COMPANY.code)+'</span></div>'+
    '<div class="kv"><span class="k">市场注册</span><span class="v">'+esc(COMPANY.reg)+'</span></div></div>'));
  foot(app);
  bindDocs();
}
function foot(app){ app.appendChild(el('<div class="foot"><p class="seal">中盛（镇江）新能源有限公司</p><p>本页面为授权信息官方核验结果，可作为业务接洽核实依据<br>请通过正规渠道办理相关业务</p></div>')); }
var ALL=[]; DOCS.forEach(function(g){g.items.forEach(function(it){ALL.push(it);});});
var lb=document.getElementById("lb"), lbIdx=0;
function bindDocs(){ Array.prototype.forEach.call(document.querySelectorAll(".doc-item"),function(b){ b.addEventListener("click",function(){openLB(parseInt(b.getAttribute("data-i"),10));}); }); }
function openLB(i){lbIdx=i;renderLB();lb.hidden=false;document.body.style.overflow="hidden";}
function closeLB(){lb.hidden=true;document.body.style.overflow="";}
function renderLB(){
  var it=ALL[lbIdx];
  document.getElementById("lb-img").src=it.src;
  document.getElementById("lb-cap").textContent=it.t;
  document.getElementById("lb-cnt").textContent=(lbIdx+1)+" / "+ALL.length;
  document.getElementById("lb-orig").href=it.src;
  document.getElementById("lb-prev").disabled=(lbIdx===0);
  document.getElementById("lb-next").disabled=(lbIdx===ALL.length-1);
}
document.getElementById("lb-x").addEventListener("click",closeLB);
document.getElementById("lb-prev").addEventListener("click",function(){if(lbIdx>0){lbIdx--;renderLB();}});
document.getElementById("lb-next").addEventListener("click",function(){if(lbIdx<ALL.length-1){lbIdx++;renderLB();}});
lb.addEventListener("click",function(e){if(e.target===lb||e.target.classList.contains("lb-mid"))closeLB();});
var tx0=null;
lb.addEventListener("touchstart",function(e){tx0=e.touches[0].clientX;},{passive:true});
lb.addEventListener("touchend",function(e){ if(tx0===null)return; var dx=e.changedTouches[0].clientX-tx0; if(Math.abs(dx)>48){if(dx<0&&lbIdx<ALL.length-1){lbIdx++;renderLB();}if(dx>0&&lbIdx>0){lbIdx--;renderLB();}} tx0=null; },{passive:true});
document.addEventListener("keydown",function(e){ if(lb.hidden)return; if(e.key==="Escape")closeLB(); if(e.key==="ArrowLeft"&&lbIdx>0){lbIdx--;renderLB();} if(e.key==="ArrowRight"&&lbIdx<ALL.length-1){lbIdx++;renderLB();} });
window.addEventListener("hashchange",render);
render();
</script>
</body>
</html>
