<title>授权业务代表核验 · 中盛（镇江）新能源</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpolygon points='24,3 43,14 43,34 24,45 5,34 5,14' fill='%231B3A8B'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
:root{--navy:#1B3A8B;--navy-d:#132B68;--ok:#1a9e6e;--ok-bg:#e7f7f0;--warn:#b96a12;--warn-bg:#fdf3e3;--line:#e6e9f0;--mut:#7a8396;--ink:#222a3a;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-text-size-adjust:100%;}
body{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;background:#eef1f6;color:var(--ink);min-height:100vh;}
.wrap{max-width:430px;margin:0 auto;min-height:100vh;background:#f4f6fa;box-shadow:0 0 24px rgba(20,40,90,.08);}
.top{background:linear-gradient(150deg,var(--navy),var(--navy-d));padding:16px 18px;display:flex;align-items:center;gap:11px;}
.top .lg{width:40px;height:40px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.top .lg img{width:31px;height:31px;object-fit:contain;}
.top .cn{color:#fff;font-size:14.5px;font-weight:700;line-height:1.35;}
.top .cn small{display:block;font-size:10.5px;font-weight:400;opacity:.82;margin-top:2px;}
.banner{margin:16px 16px 0;border-radius:12px;padding:16px;text-align:center;}
.banner.ok{background:var(--ok-bg);border:1px solid #bfe6d5;}
.banner.bad{background:#fbeaea;border:1px solid #f0c5c5;}
.banner .ico{width:46px;height:46px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;}
.banner.ok .ico{background:var(--ok);}
.banner.bad .ico{background:#d05656;}
.banner .st{font-size:19px;font-weight:900;}
.banner.ok .st{color:var(--ok);}
.banner.bad .st{color:#c14545;}
.banner .ds{font-size:11.5px;color:var(--mut);margin-top:5px;line-height:1.5;}
.card{background:#fff;margin:14px 16px 0;border-radius:12px;padding:15px 16px;border:1px solid var(--line);}
.card h3{font-size:13.5px;font-weight:700;color:var(--navy);margin-bottom:11px;display:flex;align-items:center;gap:7px;}
.card h3::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--navy);}
.kv{display:flex;font-size:13px;line-height:1.5;padding:6px 0;}
.kv .k{width:64px;color:var(--mut);flex:0 0 auto;font-size:12.5px;}
.kv .v{color:var(--ink);font-weight:500;flex:1;word-break:break-all;}
ul.scope{list-style:none;}
ul.scope li{font-size:12.8px;line-height:1.5;padding:5px 0 5px 22px;color:#333d52;position:relative;}
ul.scope li::before{content:"";position:absolute;left:0;top:9px;width:13px;height:13px;border-radius:50%;background:var(--ok-bg);border:1px solid #9fd8c0;}
ul.scope li::after{content:"";position:absolute;left:4px;top:12px;width:5px;height:3px;border-left:1.6px solid var(--ok);border-bottom:1.6px solid var(--ok);transform:rotate(-45deg);}
.notice{background:var(--warn-bg);border:1px solid #f2dcb8;}
.notice h3{color:var(--warn);}
.notice h3::before{background:var(--warn);}
.notice p{font-size:12.6px;line-height:1.65;color:#6f4d1e;padding:4px 0;}
.notice p b{color:var(--warn);}
.foot{padding:18px 20px 26px;text-align:center;}
.foot p{font-size:10.8px;color:var(--mut);line-height:1.7;}
.foot .seal{font-size:11px;color:var(--navy);font-weight:600;margin-bottom:6px;}
</style>
</head>
